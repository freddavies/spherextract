[project]
name = "spherex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Francesco Guarneri", email = "50723359+G-Francio@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy>=8.0.1",
    "healpy>=1.19.0",
    "ipython>=9.15.0",
    "numpy>=2.5.1",
    "pyarrow>=21.0.0",
    "scipy>=1.18.0",
    "talltable",
]

[project.scripts]
spherex = "spherex:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
talltable = { git = "https://github.com/cmhainje/talltable.git", subdirectory = "packages/core" }
